<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Arkitektonisk fasadeskisse av Fjordterrassene på Nyhavna i Trondheim">
  <defs>
    <linearGradient id="skyMod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="60%" stop-color="#101520"/>
      <stop offset="100%" stop-color="#171E2B"/>
    </linearGradient>
    <linearGradient id="waterMod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1018"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <pattern id="gridMod" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#A9C3D9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#skyMod)"/>
  <rect width="1600" height="630" fill="url(#gridMod)"/>

  <!-- Fjord Horizon -->
  <line x1="0" y1="630" x2="1600" y2="630" stroke="#A9C3D9" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Sculptural Stepped Mass-Timber & Glass Fjord Terraces -->
  <g fill="#121720" stroke="#F5F2EB" stroke-opacity="0.72" stroke-width="1.3">
    <!-- Left stepped volume -->
    <rect x="160" y="450" width="380" height="180"/>
    <rect x="210" y="380" width="290" height="70"/>
    <rect x="260" y="315" width="180" height="65"/>
    <!-- Cantilevered Central Cultural Pavilion -->
    <polygon points="590,630 590,465 980,465 1045,535 980,535 980,630"/>
    <rect x="650" y="355" width="280" height="110"/>
    <rect x="700" y="270" width="175" height="85"/>
    <!-- Right stepped tower -->
    <rect x="1080" y="410" width="330" height="220"/>
    <rect x="1135" y="330" width="220" height="80"/>
    <rect x="1185" y="255" width="125" height="75"/>
  </g>

  <!-- Floor-to-ceiling illuminated glass bays & timber soffits -->
  <g fill="#A9C3D9" fill-opacity="0.18" stroke="#A9C3D9" stroke-opacity="0.45" stroke-width="1">
    <rect x="185" y="470" width="330" height="135"/>
    <rect x="615" y="485" width="340" height="120"/>
    <rect x="1105" y="435" width="280" height="170"/>
  </g>
  <g fill="#DFC38D" fill-opacity="0.28" stroke="#C9A96E" stroke-opacity="0.65" stroke-width="1">
    <rect x="235" y="398" width="240" height="36"/>
    <rect x="675" y="375" width="230" height="68"/>
    <rect x="720" y="290" width="135" height="48"/>
    <rect x="1160" y="350" width="170" height="44"/>
  </g>

  <!-- Fjord Water & Reflections -->
  <rect x="0" y="630" width="1600" height="270" fill="url(#waterMod)"/>
  <g stroke="#A9C3D9" stroke-opacity="0.24" stroke-width="1.2">
    <line x1="200" y1="670" x2="500" y2="670"/>
    <line x1="610" y1="690" x2="990" y2="690"/>
    <line x1="660" y1="720" x2="910" y2="720"/>
    <line x1="1120" y1="678" x2="1380" y2="678"/>
  </g>
</svg>
