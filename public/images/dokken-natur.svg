<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Arkitektonisk fasadeskisse av Dokken Fjordpark i Bergen">
  <defs>
    <linearGradient id="skyPark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07090B"/>
      <stop offset="65%" stop-color="#10181A"/>
      <stop offset="100%" stop-color="#17201E"/>
    </linearGradient>
    <linearGradient id="waterPark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1416"/>
      <stop offset="100%" stop-color="#06080A"/>
    </linearGradient>
    <pattern id="gridPark" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#9AC6AE" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#skyPark)"/>
  <rect width="1600" height="635" fill="url(#gridPark)"/>

  <!-- Mountain silhouettes -->
  <path d="M0 470 L240 310 L510 410 L820 265 L1120 390 L1390 285 L1600 395 L1600 635 L0 635 Z" fill="#0B1113" stroke="#9AC6AE" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Terraced Mass-Timber Eco Pavilions -->
  <g fill="#141918" stroke="#F5F2EB" stroke-opacity="0.65" stroke-width="1.3">
    <rect x="200" y="445" width="320" height="165"/>
    <rect x="260" y="375" width="220" height="70"/>
    <rect x="310" y="325" width="120" height="50"/>
    <rect x="650" y="465" width="360" height="145"/>
    <rect x="705" y="405" width="250" height="60"/>
    <rect x="1110" y="430" width="290" height="180"/>
    <rect x="1150" y="365" width="210" height="65"/>
  </g>

  <!-- Green Roofs & Rain Gardens (Ecological accent) -->
  <g stroke="#9AC6AE" stroke-width="2" fill="#9AC6AE" fill-opacity="0.18">
    <rect x="195" y="438" width="330" height="7"/>
    <rect x="255" y="368" width="230" height="7"/>
    <rect x="645" y="458" width="370" height="7"/>
    <rect x="700" y="398" width="260" height="7"/>
    <rect x="1105" y="423" width="300" height="7"/>
    <path d="M80 635 Q240 585 420 615 T780 605 T1160 612 T1520 635 Z" fill-opacity="0.14"/>
  </g>

  <!-- Warm Timber Interior Glazing -->
  <g fill="#C9A96E" fill-opacity="0.28" stroke="#DFC38D" stroke-opacity="0.55" stroke-width="1">
    <rect x="225" y="470" width="70" height="115"/><rect x="315" y="470" width="70" height="115"/><rect x="405" y="470" width="85" height="115"/>
    <rect x="680" y="490" width="90" height="95"/><rect x="795" y="490" width="90" height="95"/><rect x="905" y="490" width="75" height="95"/>
    <rect x="1140" y="460" width="75" height="125"/><rect x="1235" y="460" width="130" height="125"/>
  </g>

  <!-- Coastal Boardwalk & Floating Sea Pier -->
  <rect x="0" y="635" width="1600" height="265" fill="url(#waterPark)"/>
  <line x1="80" y1="635" x2="1520" y2="635" stroke="#9AC6AE" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="520" y="635" width="220" height="20" fill="#1C2220" stroke="#C9A96E" stroke-opacity="0.55"/>
  <circle cx="630" cy="705" r="46" fill="none" stroke="#9AC6AE" stroke-opacity="0.55" stroke-width="1.6"/>
  <circle cx="630" cy="705" r="34" fill="#0B1315" stroke="#C9A96E" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#9AC6AE" stroke-opacity="0.22" stroke-width="1">
    <line x1="230" y1="675" x2="410" y2="675"/><line x1="760" y1="690" x2="960" y2="690"/><line x1="1150" y1="680" x2="1360" y2="680"/>
  </g>
</svg>
